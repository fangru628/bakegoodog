<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="被狗咬一口">
    <title>被狗咬一口 - 市集收銀機</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入圓潤厚重黑體字型（對標饅頭黑體風格，支援完整繁體中文無缺字） -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800;900&family=Noto+Sans+TC:wght@800;900&family=Zen+Maru+Gothic:wght@900&display=swap" rel="stylesheet">

    <style>
        :root {
            --coffee: #332109;
            --pink: #f4ced4;
            --lime: #e2e583;
        }

        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
        }

        body {
            background-color: var(--coffee);
            color: var(--coffee);
            font-family: 'M PLUS Rounded 1c', 'Zen Maru Gothic', 'Noto Sans TC', 'PingFang TC', sans-serif;
            font-weight: 900;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            width: 100%;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        /* 饅頭黑體風格厚重字體感 */
        .mantou-text {
            font-family: 'M PLUS Rounded 1c', 'Zen Maru Gothic', 'Noto Sans TC', sans-serif;
            font-weight: 900;
            letter-spacing: 0.02em;
        }

        /* 原圖風格：左侧產品區細框線 */
        .product-frame {
            border: 2px solid var(--lime);
            border-radius: 14px;
            background-color: var(--coffee);
        }

        /* 原圖風格：庫存小方框壓在膠囊左上方 */
        .stock-box {
            background-color: var(--coffee);
            border: 1.5px solid var(--lime);
            color: #ffffff;
            font-size: 13px;
            line-height: 1.1;
            padding: 2px 8px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            z-index: 2;
        }

        /* 黃綠色膠囊商品按鈕 */
        .item-capsule {
            background-color: var(--lime);
            border-radius: 9999px;
            transition: transform 0.08s ease, filter 0.08s ease;
        }
        .item-capsule:active:not(:disabled) {
            transform: scale(0.97);
            filter: brightness(0.93);
        }

        /* 價格深咖啡色圓章 */
        .price-circle {
            background-color: var(--coffee);
            color: #ffffff;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* 右側粉色收銀機外框（雙層咖啡色細線內框還原原圖） */
        .register-outer {
            background-color: var(--pink);
            border-radius: 38px;
            padding: 10px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        }
        .register-inner {
            border: 1.8px solid var(--coffee);
            border-radius: 30px;
            height: 100%;
            width: 100%;
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* 收銀機頂部白色螢幕 */
        .register-screen {
            background-color: #ffffff;
            border: 1.8px solid var(--coffee);
            border-radius: 10px;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* 螢幕右下角黃綠色描邊大數字 (如原圖 355) */
        .screen-big-total {
            color: var(--lime);
            -webkit-text-stroke: 2px var(--coffee);
            paint-order: stroke fill;
            font-weight: 900;
            line-height: 1;
            letter-spacing: 0.02em;
        }

        /* 白色雙圈立體按鍵（原圖風格：白底 + 內圈咖啡色細線 + 底部微立體白邊） */
        .key-btn {
            background-color: #ffffff;
            color: var(--coffee);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.06s ease;
            cursor: pointer;
            box-shadow: 2px 3px 0px #ffffff;
            border: 1.8px solid var(--coffee);
        }
        .key-btn::after {
            content: '';
            position: absolute;
            inset: 2px;
            border-radius: inherit;
            border: 1px solid rgba(51, 33, 9, 0.25);
            pointer-events: none;
        }
        .key-btn:active {
            transform: translate(1px, 2px);
        }

        /* 右下角今日收入多角星芒（使用完整 SVG 星芒避免任何邊角被裁切） */
        .income-starburst {
            transform: rotate(6deg);
            transition: transform 0.15s ease;
            cursor: pointer;
            overflow: visible;
        }
        .income-starburst:active {
            transform: rotate(6deg) scale(0.95);
        }

            color: var(--coffee);
            -webkit-text-stroke: 3px #ffffff;
            paint-order: stroke fill;
